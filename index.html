<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Recipe Card Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,650&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4efe5;
      --paper: #fffdf7;
      --paper-2: #f9f2e7;
      --ink: #24261f;
      --muted: #66685e;
      --line: #d9d0bf;
      --green: #285642;
      --green-soft: #dce7dc;
      --rust: #b54a2d;
      --gold: #c5912e;
      --shadow: 0 18px 50px rgba(64, 51, 32, .15);
      --focus: #126b50;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171a17;
        --paper: #242823;
        --paper-2: #2b302a;
        --ink: #f5efe4;
        --muted: #c3c3b8;
        --line: #42483f;
        --green: #8fc4a6;
        --green-soft: #263a2e;
        --rust: #f08b6e;
        --gold: #e2b557;
        --shadow: 0 20px 55px rgba(0,0,0,.28);
        --focus: #8fc4a6;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background-color: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
      background-image:
        linear-gradient(rgba(108, 91, 66, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108, 91, 66, .035) 1px, transparent 1px);
      background-size: 26px 26px;
    }
    button { font: inherit; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .page { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 44px 0 64px; }
    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }
    .intro-copy { max-width: 700px; }
    .eyebrow { margin: 0 0 10px; color: var(--rust); font-weight: 600; font-size: .83rem; letter-spacing: .04em; }
    h1 {
      font-family: "Newsreader", serif;
      font-size: clamp(2.65rem, 6vw, 5.7rem);
      line-height: .92;
      font-weight: 650;
      letter-spacing: -.04em;
      max-width: 760px;
      margin: 0;
    }
    .lede { margin: 20px 0 0; max-width: 620px; color: var(--muted); font-size: 1rem; line-height: 1.62; }
    .count-stamp {
      width: 138px;
      min-height: 138px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid;
      place-content: center;
      text-align: center;
      transform: rotate(3deg);
      background: var(--paper);
    }
    .count-stamp strong { font-family: "Newsreader", serif; font-size: 2.25rem; line-height: 1; color: var(--green); }
    .count-stamp span { color: var(--muted); font-size: .78rem; margin-top: 5px; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 0 22px;
    }
    .tabs { display: flex; gap: 5px; padding: 4px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 999px; }
    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 15px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: .88rem;
    }
    .tab[aria-selected="true"] { background: var(--green); color: #fffdf7; }
    @media (prefers-color-scheme: dark) { .tab[aria-selected="true"] { color: #172019; } }
    .session-note { color: var(--muted); font-size: .78rem; text-align: right; }
    .recipe-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start; }
    .recipe-card {
      perspective: 1400px;
      width: 100%;
      aspect-ratio: 3 / 4.22;
      min-height: 500px;
      touch-action: pan-y pinch-zoom;
      -webkit-tap-highlight-color: transparent;
    }
    .recipe-card-inner {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform .62s cubic-bezier(.2,.72,.25,1);
      will-change: transform;
    }
    .recipe-card.direction-positive.is-flipped .recipe-card-inner { transform: rotateY(180deg); }
    .recipe-card.direction-negative.is-flipped .recipe-card-inner { transform: rotateY(-180deg); }
    .recipe-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      border-radius: 18px 18px 30px 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
    }
    .recipe-face[aria-hidden="true"] { pointer-events: none; }
    .recipe-front { cursor: grab; }
    .recipe-card.direction-positive .recipe-back { transform: rotateY(180deg); }
    .recipe-card.direction-negative .recipe-back { transform: rotateY(-180deg); }
    .dish-art { position: relative; height: 61%; overflow: hidden; background: var(--dish-bg); touch-action: pan-y pinch-zoom; cursor: grab; }
    .dish-art::after {
      content: "";
      position: absolute; inset: auto 16px 13px;
      height: 1px; background: rgba(255,255,255,.55);
    }
    .dish-art svg { width: 100%; height: 100%; display: block; }
    .card-index {
      position: absolute; top: 16px; left: 17px;
      color: rgba(255,255,255,.9); font-weight: 600; font-size: .75rem; letter-spacing: .06em;
    }
    .top-actions {
      position: absolute; top: 12px; right: 12px;
      display: flex; gap: 8px;
    }
    .save-btn, .share-btn {
      width: 43px; height: 43px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.76);
      background: rgba(24, 30, 24, .55); color: white;
      display: grid; place-items: center; cursor: pointer;
      transition: background .2s, color .2s;
    }
    .save-btn svg, .share-btn svg { width: 20px; height: 20px; }
    .save-btn.is-saved { background: var(--paper); color: var(--rust); border-color: var(--paper); }
    .save-btn.is-saved svg { fill: currentColor; }
    .share-btn:hover, .share-btn:focus-visible { background: rgba(24, 30, 24, .78); }
    .rating-control {
      position: absolute; top: 47px; left: 12px;
      display: flex; align-items: center; gap: 1px;
      padding: 5px 7px;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 999px;
      background: rgba(24,30,24,.58);
      color: rgba(255,255,255,.68);
    }
    .rating-star {
      width: 21px; height: 24px; padding: 3px; border: 0;
      display: grid; place-items: center; cursor: pointer;
      color: rgba(255,255,255,.72); background: transparent;
    }
    .rating-star svg { width: 15px; height: 15px; fill: transparent; }
    .rating-star.is-active { color: #f1c75b; }
    .rating-star.is-active svg { fill: currentColor; }
    .rating-star:hover { color: #ffe19a; }
    .recipe-front-body { padding: 19px 21px 20px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
    .recipe-name { margin: 0; font-family: "Newsreader", serif; font-size: 1.9rem; line-height: 1; font-weight: 650; letter-spacing: -.02em; }
    .recipe-meta { margin: 0; color: var(--muted); font-size: .79rem; line-height: 1.4; }
    .swipe-hint { margin: 2px 0 0; color: var(--muted); font-size: .7rem; line-height: 1.3; }
    .swipe-hint span { color: var(--green); font-weight: 600; letter-spacing: .04em; }
    .recipe-actions { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .view-btn, .back-btn {
      color: var(--green); background: transparent; border: 0; padding: 5px 0;
      font-weight: 600; font-size: .86rem; cursor: pointer;
    }
    .view-btn { display: inline-flex; align-items: center; gap: 8px; }
    .view-btn svg { width: 18px; height: 18px; transition: transform .2s; }
    .view-btn:hover svg { transform: translateX(3px); }
    .recipe-label { color: var(--rust); font-size: .72rem; font-weight: 600; }
    .recipe-back { cursor: grab; }
    .recipe-back-header { display: flex; align-items: start; justify-content: space-between; gap: 16px; padding: 18px 19px 13px; border-bottom: 1px solid var(--line); }
    .recipe-back-header h3 { font-size: 1.35rem; }
    .back-btn { color: var(--rust); flex: 0 0 auto; }
    .recipe-back-columns {
      display: grid; grid-template-columns: .9fr 1.15fr; gap: 18px;
      padding: 16px 18px 21px; overflow-y: auto; overscroll-behavior: contain; flex: 1;
      touch-action: pan-y pinch-zoom;
      scrollbar-color: var(--line) transparent;
    }
    .recipe-back-col + .recipe-back-col { border-left: 1px solid var(--line); padding-left: 18px; }
    .recipe-back-heading { margin: 0 0 10px; font-size: .72rem; color: var(--rust); letter-spacing: .06em; }
    .ingredients-list, .instructions-list { margin: 0; padding-left: 17px; color: var(--ink); font-size: .73rem; line-height: 1.42; }
    .ingredients-list { display: flex; flex-direction: column; gap: 6px; }
    .instructions-list { display: flex; flex-direction: column; gap: 9px; }
    .ingredient-amount { font-weight: 600; color: var(--green); margin-right: 3px; }
    .empty-state {
      grid-column: 1 / -1; padding: 72px 24px; text-align: center; border: 1px dashed var(--line); border-radius: 18px; background: var(--paper-2);
    }
    .empty-state h2 { font-family: "Newsreader", serif; font-size: 2rem; margin: 0 0 8px; }
    .empty-state p { margin: 0 0 20px; color: var(--muted); }
    .primary-btn { border: 0; background: var(--green); color: #fffdf7; border-radius: 999px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
    @media (prefers-color-scheme: dark) { .primary-btn { color: #172019; } }
    .contract {
      margin-top: 46px; border-top: 1px solid var(--line); padding-top: 28px;
      display: grid; grid-template-columns: .72fr 1.28fr; gap: 34px;
    }
    .contract h2 { font-family: "Newsreader", serif; font-size: 2rem; margin: 0 0 8px; }
    .contract p { margin: 0; color: var(--muted); line-height: 1.6; font-size: .9rem; }
    .contract code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .code-block { margin: 0; padding: 18px 20px; background: #1d211d; color: #eef2e9; border-radius: 10px; overflow-wrap: anywhere; white-space: pre-wrap; font-size: .75rem; line-height: 1.55; border: 1px solid #3b433a; }
    .code-key { color: #f1b88f; } .code-type { color: #a7cfad; } .code-comment { color: #9da79a; }
    .toast {
      position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 18px);
      opacity: 0; pointer-events: none; background: var(--ink); color: var(--paper); padding: 10px 15px; border-radius: 999px; font-size: .82rem;
      transition: opacity .2s, transform .2s; z-index: 20; box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 900px) {
      .recipe-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .contract { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .page { width: min(100% - 24px, 430px); padding-top: 28px; }
      .intro { grid-template-columns: 1fr; gap: 20px; }
      h1 { font-size: clamp(3rem, 16vw, 4.7rem); }
      .count-stamp { display: none; }
      .toolbar { align-items: flex-end; }
      .tabs { flex: 1; }
      .tab { flex: 1; padding-inline: 10px; }
      .session-note { max-width: 100px; }
      .recipe-grid { grid-template-columns: 1fr; gap: 20px; }
      .recipe-card { min-height: 520px; }
      .recipe-back-columns { grid-template-columns: 1fr; }
      .recipe-back-col + .recipe-back-col { border-left: 0; border-top: 1px solid var(--line); padding: 14px 0 0; }
      .ingredients-list, .instructions-list { font-size: .8rem; }
      .contract { margin-top: 36px; gap: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .recipe-card-inner, .toast, .view-btn svg { transition: none; }
      .recipe-card-inner { will-change: auto; }
    }
  </style>
</head>
