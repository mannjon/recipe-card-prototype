<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4efe5" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171a17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Recipe Cards" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <title>Recipe Card Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,650&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4efe5;
      --paper: #fffdf7;
      --paper-2: #f9f2e7;
      --ink: #24261f;
      --muted: #66685e;
      --line: #d9d0bf;
      --green: #285642;
      --green-soft: #dce7dc;
      --rust: #b54a2d;
      --gold: #c5912e;
      --shadow: 0 18px 50px rgba(64, 51, 32, .15);
      --focus: #126b50;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171a17;
        --paper: #242823;
        --paper-2: #2b302a;
        --ink: #f5efe4;
        --muted: #c3c3b8;
        --line: #42483f;
        --green: #8fc4a6;
        --green-soft: #263a2e;
        --rust: #f08b6e;
        --gold: #e2b557;
        --shadow: 0 20px 55px rgba(0,0,0,.28);
        --focus: #8fc4a6;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background-color: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
      background-image:
        linear-gradient(rgba(108, 91, 66, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108, 91, 66, .035) 1px, transparent 1px);
      background-size: 26px 26px;
    }
    button { font: inherit; }
    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .page { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 44px 0 64px; }
    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }
    .intro-copy { max-width: 700px; }
    .eyebrow { margin: 0 0 10px; color: var(--rust); font-weight: 600; font-size: .83rem; letter-spacing: .04em; }
    h1 {
      font-family: "Newsreader", serif;
      font-size: clamp(2.65rem, 6vw, 5.7rem);
      line-height: .92;
      font-weight: 650;
      letter-spacing: -.04em;
      max-width: 760px;
      margin: 0;
    }
    .lede { margin: 20px 0 0; max-width: 620px; color: var(--muted); font-size: 1rem; line-height: 1.62; }
    .count-stamp {
      width: 138px;
      min-height: 138px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid;
      place-content: center;
      text-align: center;
      transform: rotate(3deg);
      background: var(--paper);
    }
    .count-stamp strong { font-family: "Newsreader", serif; font-size: 2.25rem; line-height: 1; color: var(--green); }
    .count-stamp span { color: var(--muted); font-size: .78rem; margin-top: 5px; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 28px 0 22px;
    }
    .tabs { display: flex; gap: 5px; padding: 4px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 999px; }
    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 15px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: .88rem;
    }
    .tab[aria-selected="true"] { background: var(--green); color: #fffdf7; }
    @media (prefers-color-scheme: dark) { .tab[aria-selected="true"] { color: #172019; } }
    .session-note { color: var(--muted); font-size: .78rem; text-align: right; }
    .controls { margin: 0 0 14px; }
    .controls-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .search-input {
      flex: 1 1 260px; min-width: 0;
      background: var(--paper); color: var(--ink);
      border: 1px solid var(--line); border-radius: 999px;
      padding: 11px 18px; font: inherit; font-size: .92rem;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .sort-select {
      flex: 0 1 auto;
      background: var(--paper); color: var(--ink);
      border: 1px solid var(--line); border-radius: 999px;
      padding: 11px 14px; font: inherit; font-size: .88rem; font-weight: 600; cursor: pointer;
    }
    .sort-select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
    .chip {
      border: 1px solid var(--line); background: var(--paper); color: var(--muted);
      padding: 7px 13px; border-radius: 999px; cursor: pointer;
      font-weight: 600; font-size: .8rem;
    }
    .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fffdf7; }
    @media (prefers-color-scheme: dark) { .chip[aria-pressed="true"] { color: #172019; } }
    .chip-use-first[aria-pressed="true"] { background: var(--rust); border-color: var(--rust); color: #fffdf7; }
    .mode-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
    .mode-toggle { display: flex; gap: 5px; padding: 4px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 999px; }
    .mode-btn {
      border: 0; background: transparent; color: var(--muted);
      padding: 9px 15px; border-radius: 999px; cursor: pointer;
      font-weight: 600; font-size: .88rem;
    }
    .mode-btn[aria-pressed="true"] { background: var(--green); color: #fffdf7; }
    @media (prefers-color-scheme: dark) { .mode-btn[aria-pressed="true"] { color: #172019; } }
    .mode-hint { margin: 0; color: var(--muted); font-size: .82rem; line-height: 1.5; flex: 1 1 260px; }
    .picker { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin: 0 0 12px; }
    .picker-label { color: var(--rust); font-weight: 600; font-size: .72rem; letter-spacing: .06em; margin-right: 2px; }
    .chip-pick[aria-pressed="true"] { background: var(--rust); border-color: var(--rust); color: #fffdf7; }
    .result-row { display: flex; align-items: center; gap: 14px; margin: 2px 0 18px; }
    .result-count { margin: 0; color: var(--muted); font-size: .82rem; }
    .clear-btn { border: 0; background: transparent; color: var(--rust); font-weight: 600; font-size: .82rem; cursor: pointer; padding: 4px 0; }
    .front-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .use-first-badge {
      background: var(--rust); color: #fffdf7; border-radius: 999px;
      padding: 2px 8px; font-size: .66rem; font-weight: 600; letter-spacing: .04em;
    }
    .uses-note { margin: 0 0 10px; color: var(--muted); font-size: .7rem; line-height: 1.5; }
    .uses-note strong { color: var(--rust); font-weight: 600; letter-spacing: .04em; }
    .pantry-head { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .pantry-note { margin: 12px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.55; }
    .pantry-note strong { color: var(--ink); font-weight: 600; }
    .pantry-group { margin-top: 30px; }
    .pantry-group-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 9px; }
    .pantry-group-head h3 { margin: 0; font-family: "Newsreader", serif; font-size: 1.45rem; font-weight: 650; letter-spacing: -.01em; }
    .pantry-group-count { color: var(--rust); font-weight: 600; font-size: .75rem; letter-spacing: .05em; }
    .pantry-group-caveat { flex-basis: 100%; margin: 2px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.5; }
    .pantry-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .pantry-item {
      background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
      padding: 13px 15px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
    }
    .pantry-item.is-usable { cursor: pointer; }
    .pantry-item.is-usable:hover { border-color: var(--rust); }
    .pantry-item-top { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .pantry-item-name { font-weight: 600; font-size: .9rem; line-height: 1.35; }
    .pantry-item-qty { color: var(--green); font-weight: 600; font-size: .82rem; text-align: right; max-width: 46%; line-height: 1.35; }
    .pantry-item-qty span { display: block; color: var(--muted); font-weight: 400; font-size: .68rem; }
    .pantry-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge-star { background: var(--rust); color: #fffdf7; border-radius: 999px; padding: 2px 8px; font-size: .64rem; font-weight: 600; letter-spacing: .04em; }
    .badge-week { background: var(--gold); color: #241a05; border-radius: 999px; padding: 2px 8px; font-size: .64rem; font-weight: 600; letter-spacing: .04em; }
    .badge-thaw { background: var(--green-soft); color: var(--green); border-radius: 999px; padding: 2px 8px; font-size: .64rem; font-weight: 600; letter-spacing: .04em; }
    @media (prefers-color-scheme: dark) { .badge-thaw { color: var(--green); } }
    .pantry-item-cat { color: var(--muted); font-size: .7rem; font-weight: 600; letter-spacing: .05em; }
    .pantry-item-note { margin: 0; color: var(--muted); font-size: .76rem; line-height: 1.5; }
    .pantry-use { margin-top: auto; padding-top: 4px; color: var(--green); font-weight: 600; font-size: .8rem; display: inline-flex; align-items: center; gap: 7px; }
    .pantry-use svg { width: 16px; height: 16px; }
    .pantry-item.is-usable:hover .pantry-use { color: var(--rust); }
    .pantry-item.is-confirming { border-color: var(--rust); }
    .pantry-item-foot { margin-top: auto; padding-top: 4px; display: flex; align-items: center; gap: 10px; }
    .pantry-item-foot .pantry-use { margin-top: 0; padding-top: 0; }
    .pantry-remove-btn {
      margin-left: auto; border: 0; background: transparent; color: var(--muted);
      font-size: .74rem; font-weight: 600; cursor: pointer; padding: 4px 2px; white-space: nowrap;
    }
    .pantry-remove-btn:hover, .pantry-remove-btn:focus-visible { color: var(--rust); }
    .pantry-confirm {
      margin-top: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: var(--paper-2); border: 1px solid var(--rust); border-radius: 10px; padding: 9px 10px;
    }
    .pantry-confirm-text { flex: 1 1 100%; font-size: .78rem; font-weight: 600; line-height: 1.4; }
    .pantry-confirm-yes { background: var(--rust); color: #fffdf7; border: 0; border-radius: 999px; padding: 6px 13px; font-weight: 600; font-size: .76rem; cursor: pointer; }
    .pantry-confirm-no { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 13px; font-weight: 600; font-size: .76rem; cursor: pointer; }
    .recipe-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start; }
    .recipe-card {
      perspective: 1400px;
      width: 100%;
      aspect-ratio: 3 / 4.22;
      min-height: 500px;
      touch-action: pan-y pinch-zoom;
      -webkit-tap-highlight-color: transparent;
    }
    .recipe-card-inner {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform .62s cubic-bezier(.2,.72,.25,1);
      will-change: transform;
    }
    .recipe-card.direction-positive.is-flipped .recipe-card-inner { transform: rotateY(180deg); }
    .recipe-card.direction-negative.is-flipped .recipe-card-inner { transform: rotateY(-180deg); }
    .recipe-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      border-radius: 18px 18px 30px 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
    }
    .recipe-face[aria-hidden="true"] { pointer-events: none; }
    .recipe-front { cursor: grab; }
    .recipe-card.direction-positive .recipe-back { transform: rotateY(180deg); }
    .recipe-card.direction-negative .recipe-back { transform: rotateY(-180deg); }
    .dish-art { position: relative; height: 61%; overflow: hidden; background: var(--dish-bg); touch-action: pan-y pinch-zoom; cursor: grab; }
    .dish-art::after {
      content: "";
      position: absolute; inset: auto 16px 13px;
      height: 1px; background: rgba(255,255,255,.55);
    }
    .dish-art svg { width: 100%; height: 100%; display: block; }
    .card-index {
      position: absolute; top: 16px; left: 17px;
      color: rgba(255,255,255,.9); font-weight: 600; font-size: .75rem; letter-spacing: .06em;
    }
    .top-actions {
      position: absolute; top: 12px; right: 12px;
      display: flex; gap: 8px;
    }
    .save-btn, .share-btn {
      width: 43px; height: 43px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.76);
      background: rgba(24, 30, 24, .55); color: white;
      display: grid; place-items: center; cursor: pointer;
      transition: background .2s, color .2s;
    }
    .save-btn svg, .share-btn svg { width: 20px; height: 20px; }
    .save-btn.is-saved { background: var(--paper); color: var(--rust); border-color: var(--paper); }
    .save-btn.is-saved svg { fill: currentColor; }
    .share-btn:hover, .share-btn:focus-visible { background: rgba(24, 30, 24, .78); }
    .rating-control {
      position: absolute; top: 47px; left: 12px;
      display: flex; align-items: center; gap: 1px;
      padding: 5px 7px;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 999px;
      background: rgba(24,30,24,.58);
      color: rgba(255,255,255,.68);
    }
    .rating-star {
      width: 21px; height: 24px; padding: 3px; border: 0;
      display: grid; place-items: center; cursor: pointer;
      color: rgba(255,255,255,.72); background: transparent;
    }
    .rating-star svg { width: 15px; height: 15px; fill: transparent; }
    .rating-star.is-active { color: #f1c75b; }
    .rating-star.is-active svg { fill: currentColor; }
    .rating-star:hover { color: #ffe19a; }
    .recipe-front-body { padding: 19px 21px 20px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
    .recipe-name { margin: 0; font-family: "Newsreader", serif; font-size: 1.9rem; line-height: 1; font-weight: 650; letter-spacing: -.02em; }
    .recipe-meta { margin: 0; color: var(--muted); font-size: .79rem; line-height: 1.4; }
    .swipe-hint { margin: 2px 0 0; color: var(--muted); font-size: .7rem; line-height: 1.3; }
    .swipe-hint span { color: var(--green); font-weight: 600; letter-spacing: .04em; }
    .recipe-actions { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .view-btn, .back-btn {
      color: var(--green); background: transparent; border: 0; padding: 5px 0;
      font-weight: 600; font-size: .86rem; cursor: pointer;
    }
    .view-btn { display: inline-flex; align-items: center; gap: 8px; }
    .view-btn svg { width: 18px; height: 18px; transition: transform .2s; }
    .view-btn:hover svg { transform: translateX(3px); }
    .recipe-label { color: var(--rust); font-size: .72rem; font-weight: 600; }
    .recipe-back { cursor: grab; }
    .recipe-back-header { display: flex; align-items: start; justify-content: space-between; gap: 16px; padding: 18px 19px 13px; border-bottom: 1px solid var(--line); }
    .recipe-back-header h3 { font-size: 1.35rem; }
    .back-btn { color: var(--rust); flex: 0 0 auto; }
    .recipe-back-columns {
      display: grid; grid-template-columns: .9fr 1.15fr; gap: 18px;
      padding: 16px 18px 21px; overflow-y: auto; overscroll-behavior: contain; flex: 1;
      touch-action: pan-y pinch-zoom;
      scrollbar-color: var(--line) transparent;
    }
    .recipe-back-col + .recipe-back-col { border-left: 1px solid var(--line); padding-left: 18px; }
    .recipe-back-heading { margin: 0 0 10px; font-size: .72rem; color: var(--rust); letter-spacing: .06em; }
    .ingredients-list, .instructions-list { margin: 0; padding-left: 17px; color: var(--ink); font-size: .73rem; line-height: 1.42; }
    .ingredients-list { display: flex; flex-direction: column; gap: 6px; }
    .instructions-list { display: flex; flex-direction: column; gap: 9px; }
    .ingredient-amount { font-weight: 600; color: var(--green); margin-right: 3px; }
    .recipe-back-foot { border-top: 1px solid var(--line); padding: 12px 18px 16px; }
    .made-btn {
      width: 100%; border: 1px solid var(--green); background: transparent; color: var(--green);
      border-radius: 999px; padding: 9px 14px; font-weight: 600; font-size: .8rem; cursor: pointer;
    }
    .made-btn:hover, .made-btn:focus-visible { background: var(--green-soft); }
    .made-title { margin: 0 0 8px; color: var(--rust); font-weight: 600; font-size: .76rem; line-height: 1.45; }
    .made-none { margin: 0 0 10px; color: var(--muted); font-size: .78rem; line-height: 1.5; }
    .made-list { margin: 0 0 10px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; max-height: 132px; overflow-y: auto; }
    .made-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--paper-2); border: 1px solid var(--line); border-radius: 10px;
      padding: 6px 6px 6px 10px; font-size: .78rem; line-height: 1.35;
    }
    .made-x {
      border: 0; background: transparent; color: var(--rust); cursor: pointer;
      font-weight: 700; font-size: .95rem; line-height: 1; padding: 4px 8px; flex: 0 0 auto;
    }
    .made-actions { display: flex; gap: 8px; }
    .made-confirm { flex: 1; background: var(--rust); color: #fffdf7; border: 0; border-radius: 999px; padding: 9px 12px; font-weight: 600; font-size: .8rem; cursor: pointer; }
    .made-cancel { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 9px 14px; font-weight: 600; font-size: .8rem; cursor: pointer; }
    .empty-state {
      grid-column: 1 / -1; padding: 72px 24px; text-align: center; border: 1px dashed var(--line); border-radius: 18px; background: var(--paper-2);
    }
    .empty-state h2 { font-family: "Newsreader", serif; font-size: 2rem; margin: 0 0 8px; }
    .empty-state p { margin: 0 0 20px; color: var(--muted); }
    .primary-btn { border: 0; background: var(--green); color: #fffdf7; border-radius: 999px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
    @media (prefers-color-scheme: dark) { .primary-btn { color: #172019; } }
    .contract {
      margin-top: 46px; border-top: 1px solid var(--line); padding-top: 28px;
      display: grid; grid-template-columns: .72fr 1.28fr; gap: 34px;
    }
    .contract h2 { font-family: "Newsreader", serif; font-size: 2rem; margin: 0 0 8px; }
    .contract p { margin: 0; color: var(--muted); line-height: 1.6; font-size: .9rem; }
    .contract code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .code-block { margin: 0; padding: 18px 20px; background: #1d211d; color: #eef2e9; border-radius: 10px; overflow-wrap: anywhere; white-space: pre-wrap; font-size: .75rem; line-height: 1.55; border: 1px solid #3b433a; }
    .code-key { color: #f1b88f; } .code-type { color: #a7cfad; } .code-comment { color: #9da79a; }
    .toast {
      position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 18px);
      opacity: 0; pointer-events: none; background: var(--ink); color: var(--paper); padding: 10px 15px; border-radius: 999px; font-size: .82rem;
      transition: opacity .2s, transform .2s; z-index: 20; box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .install-banner[hidden] { display: none; }
    .install-banner {
      position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translate(-50%, 24px);
      width: min(560px, calc(100% - 24px)); z-index: 19;
      display: flex; align-items: center; gap: 14px;
      background: var(--paper); color: var(--ink);
      border: 1px solid var(--line); border-radius: 18px;
      box-shadow: var(--shadow); padding: 14px 16px;
      opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    }
    .install-banner.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .install-icon { width: 52px; height: 52px; border-radius: 12px; flex: 0 0 auto; }
    .install-copy { flex: 1; min-width: 0; }
    .install-copy strong { display: block; font-family: "Newsreader", serif; font-size: 1.08rem; line-height: 1.15; }
    .install-copy span { display: block; color: var(--muted); font-size: .8rem; line-height: 1.45; margin-top: 3px; }
    .install-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

    <div class="install-copy">
      <strong id="install-title">Put Recipe Cards on your home screen</strong>
      <span id="install-text">One tap from your home screen, and it opens full-screen like an app — no browser bars.</span>
    </div>
    <div class="install-actions">
      <button class="install-btn" id="install-btn" type="button" hidden>Install</button>
      <button class="install-btn" id="install-how" type="button" hidden>How?</button>
      <button class="install-dismiss" id="install-dismiss" type="button" aria-label="Not now">&times;</button>
    </div>
    <ol class="install-steps" id="install-steps" hidden></ol>
  </div>

  <script>
    /* "Add to Home Screen" guide. Session-only state: nothing is stored, and the
       banner never appears when the page already runs as an installed app. */
    (function () {
      var banner = document.getElementById('install-banner');
      if (!banner) return;
      var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      if (standalone) return;

      var installBtn = document.getElementById('install-btn');
      var howBtn = document.getElementById('install-how');
      var steps = document.getElementById('install-steps');
      var text = document.getElementById('install-text');
      var deferredPrompt = null;
      var dismissed = false;

      var ua = window.navigator.userAgent || '';
      var isIOS = /iphone|ipad|ipod/i.test(ua) || (window.navigator.platform === 'MacIntel' && window.navigator.maxTouchPoints > 1);
      var isAndroid = /android/i.test(ua);

      function show() { if (!dismissed) { banner.hidden = false; requestAnimationFrame(function () { banner.classList.add('show'); }); } }
      function hide() { dismissed = true; banner.classList.remove('show'); banner.hidden = true; }

      function setSteps(items) {
        steps.replaceChildren();
        items.forEach(function (item) {
          var li = document.createElement('li');
          li.innerHTML = item;
          steps.appendChild(li);
        });
      }
      function toggleSteps() {
        var opening = steps.hidden;
        steps.hidden = !opening;
        howBtn.textContent = opening ? 'Hide steps' : 'How?';
        if (opening) steps.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPrompt = event;
        installBtn.hidden = false;
        howBtn.hidden = true;
        steps.hidden = true;
        text.textContent = 'Tap Install and this page becomes an app on your home screen — full-screen, one tap to open.';
        show();
      });
      window.addEventListener('appinstalled', hide);

      installBtn.addEventListener('click', function () {
        if (!deferredPrompt) return;
        var showInstallPrompt = deferredPrompt.prompt.bind(deferredPrompt);
        showInstallPrompt();
        deferredPrompt.userChoice.then(function () { deferredPrompt = null; hide(); });
      });
      howBtn.addEventListener('click', toggleSteps);
      document.getElementById('install-dismiss').addEventListener('click', hide);

      if (isIOS) {
        howBtn.hidden = false;
        setSteps([
          'Tap the <strong>Share</strong> button in Safari\u2019s toolbar (the square with an arrow pointing up).',
          'Scroll the list and tap <strong>Add to Home Screen</strong>.',
          'Tap <strong>Add</strong> — the Recipe Cards icon lands on your home screen.'
        ]);
        show();
      } else if (isAndroid) {
        howBtn.hidden = false;
        setSteps([
          'Tap the <strong>\u22ee menu</strong> in your browser\u2019s toolbar.',
          'Tap <strong>Add to Home screen</strong> (or <strong>Install app</strong>).',
          'Confirm — the Recipe Cards icon lands on your home screen.'
        ]);
        /* Give beforeinstallprompt a moment to arrive; it swaps in the one-tap Install button. */
        setTimeout(show, 1200);
      }
    })();
  </script>
