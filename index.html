         visibility, label — and remember it in flipMemory so later
         renders agree. This is the PAGED-TO path, not a flip the
         cook made: the card must arrive already on its side, so
         the flip transition is suppressed while the side is
         applied. The animation plays only for the cook's own flip
         (RecipeCard's flip handler), never for a page turn. */
      function applyCardSide(card,id,flipped){
        const mem=flipMemory[id]||(flipMemory[id]={flipped:false,direction:'positive'});

      /* The book: which page it is open on, and whether a sheet is
         mid-turn. Kept outside the render like flip state, so a
         rebuild reopens the book where the cook left it (see
         renderRoot). Turning a page plays the sheet TURN — a
         HORIZONTAL flip (rotateY) — which is a different motion
         from a card's own front/back flip (a VERTICAL flip,
         rotateX), and the page a turn lands on arrives already
         on the book's current side (applyCardSide), never
         mid-flip. */
      let bookIndex=0;
      /* The recipe id of the page the book last settled open
         on. When a settle lands on a DIFFERENT page, a new card
         has loaded — and the alert dies on the spot (see
         layoutBook and killToast). */
      let bookSettledId=null;

         that BEGAN before that moment is the tail of the swipe
         that turned the page, not a fresh tap — the card reads
         this in its tap handling and refuses to flip for it,

         after a page turn (see RecipeCard's onPointerUp). */
      let lastTurnLandedAt=0;
      let leafCtx=null;
      let leafAnimId=null;

         turnBookPage), so the flying window is short and a
         fresh swipe right after a landing is read fresh. */
      let wheelAcc=0, wheelAt=0, wheelLock=0;
      function bookPagesEl(){const b=document.querySelector('.cookbook');return b?b.querySelectorAll('.recipe-page'):null;}

      /* Put the book's pages in their resting state: only the open
         page shows, the built-in header's page count and turn
         buttons agree with it, and the open page's card sits on the
         book's current side. Also binds the wheel handler (native,
         non-passive, so the book can claim wheel turns and pass
         them through at its ends) once per rebuilt element. Any
         turn still in flight when a rebuild lands is settled here:

      let bookTouchHandlers=null;

         next page zooms in after an add. The rule is the cook's:

         gone. If App has not published yet, the element is

      let toastDismiss=null;

      /* Scrolling is NORMAL everywhere in this app: the page and
         its inner regions — the card back's text columns included

         standard setting, overscroll-behavior: none on the root
         (see the stylesheet) — with no code touching finger moves
         at all. An earlier build layered a custom window-wide
         guard that refused finger moves it judged unable to
         scroll; judged wrong often enough, it stopped real
         scrolling on the List and Pantry pages as well as in the
         book, so it is gone. The book's own pages area still
         takes no native gesture (touch-action: none) and its
         handlers claim moves over the pages themselves, so a
         sideways page turn is never mistaken for a scroll and a
         pull over a page never reaches the window — but a
         gesture that starts on the back's text is left to the

         region. */
      function layoutBook(){

           same reason: React attaches touch listeners passively
           at the root, so a preventDefault inside a React touch
           prop is silently ignored — the book believed it was
           swallowing vertical drags while the browser went on
           treating a downward one as pull-to-refresh and
           reloading the page, which is why flicking back to the

           non-passively, the book's claim on the gesture (see

        if(vp&&!vp.dataset.touchBound){vp.dataset.touchBound='1';vp.addEventListener('touchstart',bookTouchStart,{passive:false});vp.addEventListener('touchmove',bookTouchMove,{passive:false});vp.addEventListener('touchend',bookTouchEnd);vp.addEventListener('touchcancel',bookTouchEnd);}

        const cur=pages[bookIndex];

           book last settled on means a NEW card has loaded —
           a turn landed, an add slid the next page into place,
           a rebuild reset the deck. The alert dies HERE, on the
           spot: it is never seen over the new card. A settle on
           the same page leaves the alert to its own timer. */
        const curPageId=cur?cur.getAttribute('data-recipe-id'):null;

          const ae=document.activeElement;

      /* The turning sheet for one turn: a double of the LEAVING
         page's card on its front, and a PLAIN darker-gray sheet
         underside on its far face — the back of the same sheet

         leaf; it waits beneath the turn as itself, veiled by
         its black shroud (see beginLeafDrag and setLeafP). A
         visual double only — it is rebuilt for every turn and
         never takes input. */
      function makeLeaf(fromEl){

        const back=document.createElement('div');
        back.className='book-leaf-face book-leaf-back book-leaf-back-plain';

         spine is the LEFT edge for both directions (see

         free edge over to the left (rotateY 0 → -180), the
         arriving page waiting beneath it under a black shroud
         whose opacity is the turn's remaining distance (1 - p),
         lightening in step with the pull to 0 at the flip.
         PREVIOUS runs from the same left side: the ARRIVING
         sheet swings from left to right, landing flat (→ 0);
         the leaving page waits beneath it, darkening under the
         arriving sheet's shadow. Its swing is CHEATED (see
         setLeafP): the folded-over half of a full swing happens
         off the left of the book, where the sheet cannot be
         seen at all, so the turn starts at edge-on — the first
         position where the arriving card is visible — instead
         of spending half the pull on an invisible sheet. The card's
         own front/back flip is a different mechanism — a
         VERTICAL flip (rotateX) — untouched. */
      function setLeafP(ctx,p){
        ctx.p=p;
        /* The spine is on the LEFT for BOTH directions — one
           hinge, one motion, mirrored. NEXT: the leaving sheet
           starts flat (0) and swings its free right edge over
           the spine to the left (0 → -180), its free edge
           travelling IN FRONT of the book, out over the top of
           the page beneath. PREVIOUS is the inverse FROM THE
           SAME LEFT SIDE, with the start CHEATED: a full swing
           would begin folded over on the left of the spine
           (-180), and the whole first half of it (-180 → -90)
           plays out off the left edge of the book, where the
           sheet is behind the spine and cannot be seen — the
           pull felt dead for half its travel before anything
           showed. So the arriving sheet starts at edge-on
           (-90), the first angle where its card face can be
           seen, and swings -90 → 0, landing flat as the pull
           completes: the card is visible from the first frame
           of the turn, and its free edge still travels in
           front, out over the top, the way a real sheet comes
           over the top when a page is turned back. (Progress
           p itself is unchanged — the halfway rule that
           decides whether a pull turns the page still reads
           the finger's own travel, not the cheated angle.) */
        const ang=ctx.dir==='next'?-180*p:-90*(1-p);
        ctx.leaf.style.transform='rotateY('+ang+'deg)';
        const shade=0.22*Math.sin(Math.PI*Math.min(1,Math.max(0,p)));

             hitch at the exact moment the finger let go. A turn

         NEXT turns the leaving page over the spine to the left,
         PREVIOUS swings the arriving page in from the left and

      function beginLeafDrag(dir){

        if(!vp||pages.length<2)return null;

           folded-over half of its swing is skipped, as it plays

        if(ctx.dir!=='next')return;

      function turnBookPage(delta){
        if(!delta)return;

           stored. A stored turn fires after the cook has
           stopped — pages flipping on their own — which reads
           as the book falling behind. Turns are fast (below),
           so the wait for the sheet to land is short and the
           next fresh swipe is read the moment it lands. */
        if(bookTurning)return;
        const pages=bookPagesEl();
        if(!pages||!pages.length)return;

      /* Flip the open page's card over — front to back, back to

      function flipBookCard(direction){

        const id=cur.getAttribute('data-recipe-id');

      /* The wheel browses SIDEWAYS only, on the cook's fixed

         two-finger sideways swipe) with deltaX > 0 is the NEXT
         page, deltaX < 0 is the PREVIOUS page. A flick is one
         turn, a hard spin carries through several, and at the
         book's ends the wheel passes through untouched. A
         VERTICAL wheel movement pages nothing at all — vertical

      function onBookWheel(e){

        if(bookTurning){

        }
        /* A wheel over a card back's text scrolls that text,

        if(e.target&&e.target.closest&&e.target.closest('.recipe-back-columns, .made-list'))return;
