<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f3f6fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#10151b" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;display=swap" rel="stylesheet" />
  <title>Meal Day Picker</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f6fa;
      --surface: #ffffff;
      --surface-soft: #e9eff7;
      --ink: #17212b;
      --muted: #586778;
      --line: #cdd8e5;
      --accent: #1167a8;
      --accent-strong: #075487;
      --accent-soft: #dcecf8;
      --success: #176b4d;
      --shadow: 0 18px 50px rgba(20, 47, 73, .10);
      --focus: #ef9b31;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10151b;
        --surface: #19212a;
        --surface-soft: #212d38;
        --ink: #f3f6f8;
        --muted: #aebcc9;
        --line: #364552;
        --accent: #69b7ee;
        --accent-strong: #8cc9f3;
        --accent-soft: #163b55;
        --success: #78d7ad;
        --shadow: 0 20px 55px rgba(0, 0, 0, .30);
        --focus: #ffbd62;
      }
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, var(--surface-soft) 0, transparent 310px),
        var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, select { font: inherit; }
    button, select, a { -webkit-tap-highlight-color: transparent; }
    main {
      width: min(100% - 32px, 780px);
      margin: 0 auto;
      padding: clamp(38px, 7vw, 74px) 0 calc(44px + env(safe-area-inset-bottom));
    }
    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 26px;
    }
    h1 {
      margin: 0 0 10px;
      max-width: 600px;
      font: 600 clamp(2.35rem, 7vw, 4.7rem)/.95 "Newsreader", Georgia, serif;
      letter-spacing: -.04em;
    }
    .lede {
      margin: 0;
      color: var(--muted);
      max-width: 520px;
      font-size: clamp(1rem, 2.2vw, 1.12rem);
      line-height: 1.55;
    }
    .week {
      color: var(--accent-strong);
      font-weight: 600;
      white-space: nowrap;
      padding-bottom: 5px;
    }
    .picker {
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .meal-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) minmax(180px, 230px);
      gap: 16px;
      align-items: center;
      min-height: 92px;
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
    }
    .meal-row:last-child { border-bottom: 0; }
    .number {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: .85rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .meal-name {
      font-family: "Newsreader", Georgia, serif;
      font-size: clamp(1.25rem, 3vw, 1.48rem);
      line-height: 1.12;
    }
    .select-wrap { position: relative; }
    select {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--ink);
      padding: 0 42px 0 14px;
      appearance: none;
      cursor: pointer;
      font-weight: 500;
    }
    .select-wrap::after {
      content: "";
      position: absolute;
      right: 16px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }
    select:focus-visible, button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .footer-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: center;
      margin-top: 20px;
      padding: 20px 2px 0;
    }
    .progress {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      min-width: 0;
    }
    .progress-track {
      width: 84px;
      height: 6px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
      flex: 0 0 auto;
    }
    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width .25s ease;
    }
    .actions { display: flex; gap: 10px; }
    button {
      min-height: 48px;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 0 18px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }
    .secondary { background: var(--surface); color: var(--ink); }
    .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    @media (prefers-color-scheme: dark) {
      .primary { color: #07121b; }
    }
    button:disabled { opacity: .48; cursor: not-allowed; }
    button:not(:disabled):active { transform: translateY(1px); }
    .helper {
      margin: 16px 2px 0;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.45;
    }
    .status {
      margin-top: 16px;
      min-height: 24px;
      color: var(--success);
      font-weight: 500;
      line-height: 1.45;
    }
    .status:empty { margin-top: 0; min-height: 0; }
    svg { width: 18px; height: 18px; flex: 0 0 auto; }
    @media (max-width: 680px) {
      main { width: min(100% - 24px, 780px); padding-top: 34px; }
      .intro { display: block; margin-bottom: 20px; }
      h1 { max-width: 500px; }
      .week { margin-top: 16px; display: block; }
      .meal-row {
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 10px 12px;
        min-height: 0;
        padding: 16px;
      }
      .number { grid-row: 1; }
      .meal-name { grid-row: 1; }
      .select-wrap { grid-column: 1 / -1; }
      .footer-panel { grid-template-columns: 1fr; gap: 16px; }
      .actions { display: grid; grid-template-columns: 1fr 1.25fr; }
      button { padding-inline: 12px; }
    }
    @media (max-width: 380px) {
      .actions { grid-template-columns: 1fr; }
      .progress-track { width: 64px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <div>
        <h1>Pick a night for each dinner.</h1>
        <p class="lede">Choose one day per meal. When all five are set, email the finished plan to Jonathan.</p>
      </div>
      <div class="week" aria-label="Week of October 18 through October 24, 2026">Oct 18–24</div>
    </header>

    <section class="picker" aria-label="Dinner day choices">
      <div class="meal-row">
        <span class="number" aria-hidden="true">01</span>
        <label class="meal-name" for="meal-0">Chili</label>
        <div class="select-wrap"><select id="meal-0" data-meal="Chili" aria-label="Choose a day for Chili"></select></div>
      </div>
      <div class="meal-row">
        <span class="number" aria-hidden="true">02</span>
        <label class="meal-name" for="meal-1">Curry</label>
        <div class="select-wrap"><select id="meal-1" data-meal="Curry" aria-label="Choose a day for Curry"></select></div>
      </div>
      <div class="meal-row">
        <span class="number" aria-hidden="true">03</span>
        <label class="meal-name" for="meal-2">Kielbasa with tomatoes &amp; feta</label>
        <div class="select-wrap"><select id="meal-2" data-meal="Kielbasa with tomatoes and feta" aria-label="Choose a day for Kielbasa with tomatoes and feta"></select></div>
      </div>
      <div class="meal-row">
        <span class="number" aria-hidden="true">04</span>
        <label class="meal-name" for="meal-3">Minestrone</label>
        <div class="select-wrap"><select id="meal-3" data-meal="Minestrone" aria-label="Choose a day for Minestrone"></select></div>
      </div>
      <div class="meal-row">
        <span class="number" aria-hidden="true">05</span>
        <label class="meal-name" for="meal-4">Birria tacos</label>
        <div class="select-wrap"><select id="meal-4" data-meal="Birria tacos" aria-label="Choose a day for Birria tacos"></select></div>
      </div>
    </section>

    <div class="footer-panel">
      <div class="progress" aria-live="polite">
        <span class="progress-track" aria-hidden="true"><span class="progress-fill" id="progress-fill"></span></span>
        <span id="progress-text">0 of 5 meals placed</span>
      </div>
      <div class="actions">
        <button class="secondary" id="copy-btn" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          Copy
        </button>
        <button class="primary" id="email-btn" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          Email Jonathan
        </button>
      </div>
    </div>
    <p class="helper">Each day can be used once. “Email Jonathan” opens a ready-to-send message in your mail app.</p>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var days = [
        { value: "Sunday, Oct 18", label: "Sun · Oct 18" },
        { value: "Monday, Oct 19", label: "Mon · Oct 19" },
        { value: "Tuesday, Oct 20", label: "Tue · Oct 20" },
        { value: "Wednesday, Oct 21", label: "Wed · Oct 21" },
        { value: "Thursday, Oct 22", label: "Thu · Oct 22" },
        { value: "Friday, Oct 23", label: "Fri · Oct 23" },
        { value: "Saturday, Oct 24", label: "Sat · Oct 24" }
      ];
      var selects = Array.prototype.slice.call(document.querySelectorAll("select[data-meal]"));
      var emailBtn = document.getElementById("email-btn");
      var copyBtn = document.getElementById("copy-btn");
      var progressText = document.getElementById("progress-text");
      var progressFill = document.getElementById("progress-fill");
      var status = document.getElementById("status");

      function populate(select) {
        var placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Choose a day";
        select.appendChild(placeholder);
        days.forEach(function (day) {
          var option = document.createElement("option");
          option.value = day.value;
          option.textContent = day.label;
          select.appendChild(option);
        });
      }

      function assignments() {
        return selects.filter(function (select) { return select.value; }).map(function (select) {
          return { meal: select.getAttribute("data-meal"), day: select.value };
        });
      }

      function update() {
        var chosen = selects.map(function (select) { return select.value; }).filter(Boolean);
        selects.forEach(function (select) {
          Array.prototype.slice.call(select.options).forEach(function (option) {
            option.disabled = Boolean(option.value && option.value !== select.value && chosen.indexOf(option.value) !== -1);
          });
        });
        var count = chosen.length;
        progressText.textContent = count === 5 ? "All 5 meals are placed" : count + " of 5 meals placed";
        progressFill.style.width = (count / 5 * 100) + "%";
        emailBtn.disabled = count !== 5;
        copyBtn.disabled = count !== 5;
        status.textContent = "";
      }

      function summary() {
        var order = days.map(function (d) { return d.value; });
        var sorted = assignments().sort(function (a, b) { return order.indexOf(a.day) - order.indexOf(b.day); });
        return "Here are my picks for next week:\n\n" + sorted.map(function (item) {
          return item.day + " — " + item.meal;
        }).join("\n");
      }

      selects.forEach(function (select) {
        populate(select);
        select.addEventListener("change", update);
      });

      emailBtn.addEventListener("click", function () {
        var subject = "Next week's dinner plan";
        var mailLink = document.createElement("a");
        mailLink.href = "mailto:?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(summary());
        mailLink.style.display = "none";
        document.body.appendChild(mailLink);
        mailLink.click();
        document.body.removeChild(mailLink);
        status.textContent = "Your mail app should open with the plan ready. Add Jonathan as the recipient, then send.";
      });

      copyBtn.addEventListener("click", function () {
        var text = summary();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            status.textContent = "Dinner plan copied.";
          }).catch(function () { fallbackCopy(text); });
        } else {
          fallbackCopy(text);
        }
      });

      function fallbackCopy(text) {
        var area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        var copied = document.execCommand("copy");
        document.body.removeChild(area);
        status.textContent = copied ? "Dinner plan copied." : "Copy wasn’t available. Use Email Jonathan instead.";
      }

      update();
    }());
  </script>
</body>
</html>
